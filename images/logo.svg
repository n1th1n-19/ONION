<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Onion Theme logo: an onion whose layers are the five palette accents (outer to core:
       Red, Shallot, Leek, Scallion, Mocha). Bulb path matches the Bulb file icons (16-grid). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262438"/>
      <stop offset="1" stop-color="#11111b"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <g transform="translate(32 40) scale(12)">
    <!-- sprout -->
    <path d="M8 1.2C7.9-.2 8.5-1.3 10.1-1.9" fill="none" stroke="#a3dc8c" stroke-width=".7" stroke-linecap="round"/>
    <path d="M9.4-1.5C10.3-2.6 11.6-2.7 12.4-2.3 11.7-1.4 10.5-1 9.4-1.5Z" fill="#a3dc8c"/>
